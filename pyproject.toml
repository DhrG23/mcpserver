[project]
name = "personal-ai-mcp"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "mcp>=2.0",
    "pydantic>=2.7",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "python-multipart",
    "ddgs",
    "cryptography>=42",
    "python-dotenv>=1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

services:
  personal-ai-mcp:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file:
      - ../.env
    volumes:
      - personal_ai_data:/data
    expose:
      - "8000"   # MCP streamable-http (Alexa+ / Nemotron)
      - "8001"   # device gateway + approvals (node apps)
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    depends_on:
      - personal-ai-mcp
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  personal_ai_data:
  caddy_data:
  caddy_config:
